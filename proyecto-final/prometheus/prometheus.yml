global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend1:5000"]
        labels: { instance_name: "backend1" }
      - targets: ["backend2:5000"]
        labels: { instance_name: "backend2" }
      - targets: ["backend3:5000"]
        labels: { instance_name: "backend3" }

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
